[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
reactive = "https://mainnet-rpc.rnk.dev/"
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "https://sepolia.base.org"
unichain_sepolia = "https://sepolia.unichain.org"
